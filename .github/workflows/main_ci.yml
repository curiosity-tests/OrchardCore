name: Main - CI

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input, so racecar can trigger a run and
#      choose baseline vs instrumented. Upstream fires on push/PR, which racecar
#      cannot drive.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together. `chalk:` is the single variable separating
#      the two arms, and `profile:` selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block zeroes every unlisted scope, so the rest is restated.
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      fail-fast cancels its siblings more often than baseline's and biases the
#      comparison.
# Build and test COMMANDS are byte-identical to upstream.

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  # Run it on main and release pushes too, in case we merge from a branch that's not up-to-date with the target branch
  # and breaks something after merge (or if we push to main).
  push:
    paths-ignore:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'src/docs/**/*'
    branches: [ main, release/** ]

env:
  # The one variable that separates the arms. On baseline, action-checkout
  # skips its Set up Chalk step entirely. The github.event_name guard keeps
  # incidental push/PR runs uninstrumented, where inputs.leg is empty.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLAYWRIGHT_TRACING: true

permissions:
  contents: read
  id-token: write

run-name: "Main - CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: Build & Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        # inert at action-checkout@main (not an input there); kept for forward-compat
        observables_continue_on_error: false
        # action-checkout defaults LFS on; actions/checkout does not
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }
    - uses: ./.github/actions/setup-dotnet
    - name: Build
      # See pr_ci.yml for the reason why we disable NuGet audit warnings.
      run: |
        dotnet build -c Release -p:TreatWarningsAsErrors=true --warnaserror -p:RunAnalyzers=true -p:NuGetAudit=false
    - name: Unit Tests
      run: |
        dotnet test --project ./test/OrchardCore.Tests/OrchardCore.Tests.csproj -c Release --no-build
    - name: Cache Playwright Browsers
      if: matrix.os == 'ubuntu-24.04'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('Directory.Packages.props') }}
    - name: Install Playwright Browsers
      if: matrix.os == 'ubuntu-24.04'
      run: |
        pwsh test/OrchardCore.Tests.Functional/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
    - name: Functional Tests - CMS
      if: matrix.os == 'ubuntu-24.04'
      run: |
        dotnet test --project test/OrchardCore.Tests.Functional/OrchardCore.Tests.Functional.csproj -c Release --no-build --filter-class "*Cms*"
    - name: Functional Tests - MVC
      if: matrix.os == 'ubuntu-24.04'
      env:
        # The MVC app uses neither Redis nor Azurite; don't start those containers for this run.
        ORCHARD_TEST_DOCKER_SERVICES: "false"
      run: |
        dotnet test --project test/OrchardCore.Tests.Functional/OrchardCore.Tests.Functional.csproj -c Release --no-build --filter-class "*Mvc*"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: matrix.os == 'ubuntu-24.04' && failure()
      with:
        name: Functional Test failure
        path: |
          src/OrchardCore.Cms.Web/App_Data_Tests_*/logs
          test/OrchardCore.Tests.Functional/traces
        retention-days: 3
